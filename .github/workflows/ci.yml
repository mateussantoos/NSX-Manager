name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs inside the SAME image a developer uses locally
# (`docker compose run --rm nsx <task>`), so "passes on my machine" and "passes
# CI" are the same statement rather than two hopeful approximations.
#
# The image is built once and shared through the GitHub Actions cache. It pins
# the clang version, which matters: clang-format output differs between major
# releases, so an unpinned toolchain would make the formatting lint give
# different answers in different places - and a lint that disagrees with itself
# is one people learn to ignore.

jobs:
  image:
    name: Build toolchain image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          load: true
          tags: nsx-manager-build:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/nsx-image.tar
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: toolchain-image
          path: /tmp/nsx-image.tar
          retention-days: 1

  checks:
    name: ${{ matrix.task }}
    needs: image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry is a task in docker/entrypoint.sh - the same command a
        # developer runs locally.
        task: [lint, test, asan, manifest, docs, switch, tidy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { submodules: recursive }

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: { name: toolchain-image, path: /tmp }

      - name: Load the toolchain image
        run: docker load --input /tmp/nsx-image.tar

      - name: ${{ matrix.task }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            nsx-manager-build:ci ${{ matrix.task }}

      - name: Upload Switch artefacts
        if: matrix.task == 'switch'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: switch-build
          path: |
            build/switch-release/**/*.nro
            build/switch-release/romfs/nsx_rcm.bin
          if-no-files-found: ignore

  pins:
    name: Dependency pins
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { submodules: recursive }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: { name: toolchain-image, path: /tmp }
      - run: docker load --input /tmp/nsx-image.tar
      - name: Verify submodule pins match PINS.md
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            nsx-manager-build:ci tools/deps/verify_pins.sh

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Runs outside the container: it checks prose cross-links, needs no
      # toolchain, and starting before the image is built keeps it off the
      # critical path.
      - uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          args: >-
            --offline --no-progress --include-fragments
            --exclude-path third_party --exclude-path apps/rcm-payload
            './**/*.md'
          fail: true

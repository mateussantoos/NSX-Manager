name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and Package Release Artifacts
        run: |
          docker compose build nsx
          docker compose run --rm nsx release "${{ github.ref_name }}"
          sudo chown -R $USER:$USER dist/
          echo "=== Staged Artifacts ==="
          ls -la dist/

      - name: Ensure Release Notes Exist
        run: |
          if [ ! -f dist/RELEASE_NOTES.md ]; then
            python3 -c "
import sys, re
ver = sys.argv[1].lstrip('v')
try:
    with open('CHANGELOG.md') as f: content = f.read()
    m = re.search(rf'## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=\n## \[|\Z)', content, re.DOTALL)
    notes = m.group(1).strip() if m else f'Release {ver}'
except Exception:
    notes = f'Release {ver}'
with open('dist/RELEASE_NOTES.md', 'w') as out: out.write(notes + '\n')
" "${{ github.ref_name }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NSX Manager ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            dist/nsx-manager-*.nro
            dist/nsx-forwarder-*.nro
            dist/nsx-manager-*.zip
            dist/nsx_rcm.bin
            dist/update.json
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror to release-metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan release-metadata-tmp
          git rm -rf .
          cp dist/update.json ./update.json
          git add update.json
          git commit -m "chore(release): mirror update.json for ${{ github.ref_name }}"
          git branch -M release-metadata
          git push origin release-metadata --force

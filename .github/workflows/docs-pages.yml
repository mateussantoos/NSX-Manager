name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'apps/forwarder/**', '.github/workflows/docs-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build API documentation
    runs-on: ubuntu-latest
    outputs:
      pages_ok: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Doxygen
        run: mkdir -p build/docs && cd docs && doxygen Doxyfile
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        continue-on-error: true
        with:
          enablement: true
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: build/docs/html }

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages_ok == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        continue-on-error: true
